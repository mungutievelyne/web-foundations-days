
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Writing Toolkit</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your space to think and write.</p>
  </header>

  <main>
    <section>
      <h2>Write your note</h2>

      <label for="note-text">Your text</label>
      <textarea
        id="note-text"
        maxlength="200"
        placeholder="Start writing here..."
        rows="6"
      ></textarea>

      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>

      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>
</body>
</html>
