
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 5 - Users API</title>
    <script src="users.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Users Directory</h1>
      <p>Load users from a remote API and search their details.</p>
    </header>

    <main>
      <button id="load-users" type="button">Load users</button>

      <p id="status" aria-live="polite">
        Click the button to load users.
      </p>

      <label for="filter-input">Filter users by name</label>
      <input
        id="filter-input"
        type="text"
        placeholder="Search by name..."
      />

      <ul id="users-list"></ul>
    </main>
  </body>
</html>
